services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  memory:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_PATH: /data/memory.db
    volumes:
      - sqlite_data:/data
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  sqlite_data:
